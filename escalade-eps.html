<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escalade EPS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e4;--card:#fffdf8;--ink:#2a2a2a;--sub:#7a7568;--line:#e4dccb;--rope:#C98A3E;--wall:#2F5D8A;--ko:#d64545}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,sans-serif;letter-spacing:-.01em}
h2{font-family:'Space Grotesk',sans-serif;margin:.2em 0 .6em;letter-spacing:-.02em}
.top{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top b{font-family:'Space Grotesk';font-size:18px;flex:1;cursor:pointer}.top .btn{padding:6px 10px}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:center}.tile:active{transform:scale(.96)}
.tile i{font-style:normal;font-size:36px;display:block}.tile b{font-family:'Space Grotesk'}
.btn{background:var(--rope);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 14px Inter;cursor:pointer;box-shadow:0 1px 3px #0002;margin:3px}
.btn.bl{background:var(--wall)}.btn.out{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.ko{background:var(--ko)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:15px Inter;margin:4px 0 10px}
label{font-size:12px;color:var(--sub)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.bd{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;background:#eee}
.no{background:#f6d5d5}.ok{background:#d3edda}.en{background:#f8ecbd}.sus{background:repeating-linear-gradient(45deg,#ccc,#ccc 4px,#eee 4px,#eee 8px)}
.vo{background:var(--wall);color:#fff}.gr{background:var(--rope);color:#fff}
.sub{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
.pick{display:block;width:100%;text-align:left;padding:14px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:#fff;font:600 15px Inter}.pick:disabled{opacity:.4}
#mb{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#mb .card{max-width:420px;width:100%;max-height:90vh;overflow:auto;margin:0}
.empty{text-align:center;color:var(--sub);padding:30px}
.ck{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}.ck input{width:auto;margin:3px 0}
</style></head><body>
<div class="top"><b onclick="go('home')">🧗 Escalade EPS</b><span class="sub" id="st"></span><button class="btn out" onclick="cfg()">⚙️</button><button class="btn out" onclick="sync(1)">🔄</button><button class="btn out" onclick="go('home')">⌂</button></div>
<main id="app"></main>
<script>
const KEY='escalade_eps_v1',GR=['3','4','4+','5a','5a+','5b','5b+','5c','5c+','6a','6a+','6b','6b+','6c'];
const CC=['Savoir mettre en baudrier seul (même emmêlé)','Reconnaître les différentes voies et leurs cordes respectives','Ne pas se mettre trop proche des camarades des autres groupes'];
const BR={g:{n:'Grimpeur',i:'🧗',p:'CSG',c:['Nœud de 8','Double nœud de 8',"Nœud d'arrêt",'Vérifier que les cordes ne sont pas vrillées','Co-vérification avec les assureurs / contre-assureurs',"Attendre le feu vert de l'enseignant","Communication normée avec l'assureur",'Pieds contre le mur au moment de la descente','Réception : se remettre sur les pieds']},
a:{n:'Assureur',i:'🪢',p:'CSA',c:['Vérifier que les cordes ne sont pas vrillées',"S'encorder avec le descendeur","Maîtriser l'assurage en 5 temps",'Co-vérification avec grimpeur / contre-assureur',"Attendre le feu vert de l'enseignant",'Communication normée','Maîtrise de la descente en « piston »','Descendre le grimpeur doucement','Ramener au sol doucement, sans à-coup']},
c:{n:'Contre-assureur',i:'🔗',p:'CSCA',c:['Vérifier que les cordes ne sont pas vrillées',"Se positionner au bon endroit par rapport à l'assureur",'Co-vérification avec grimpeur / assureur',"Garder la corde en U sans jamais qu'elle touche le sol",'Aider le grimpeur en lui donnant des conseils']}};
const SL={ok:'Validé',en:'En cours',no:'Non validé',sus:'Suspendu'};
let DB=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}return{items:{},gh:{owner:'',repo:'',branch:'main',path:'escalade-data.json',token:''}}})();
let PROF=false,tab='home',W=null,me=null,openH=null,openC=null,pv={},msgT='',T,busy=0,dirty=0;
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(DB)),L=t=>Object.values(DB.items).filter(x=>x.t===t&&!x._d);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const H=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return String(h)};
const dt=t=>new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}),tm=t=>new Date(t).toLocaleTimeString('fr-FR',{timeStyle:'short'});
const full=x=>x.fn+(x.ln?' '+x.ln:''),nf=id=>DB.items[id]?full(DB.items[id]):'?',nm=(a,b)=>a.fn.localeCompare(b.fn),cn=id=>DB.items[id]?DB.items[id].name:'?';
const act=()=>L('ses').filter(s=>s.on).sort((a,b)=>b.ts0-a.ts0)[0],dq=(s,i)=>(DB.items['dq|'+s+'|'+i]||{}).v;
const comps=b=>[...CC.map((t,i)=>['CCTB'+(i+1),t]),...BR[b].c.map((t,i)=>[BR[b].p+(i+1),t])];
function stat(i,b){if((DB.items['s|'+i+'|'+b]||{}).v)return'sus';const cs=comps(b),n=cs.filter(c=>(DB.items['r|'+i+'|'+c[0]]||{}).v).length;return n===cs.length?'ok':n?'en':'no'}
const empty=(a,b)=>`<div class="card empty"><div style="font-size:40px">🪨</div><b>${a}</b><p>${b||''}</p></div>`;
/* données : chaque enregistrement porte _ts (heure) et _p (saisi en mode prof) ; fusion = prof d'abord, sinon le plus récent */
function put(o){o._ts=Date.now();o._p=PROF;DB.items[o.id]=o;save();clearTimeout(T);T=setTimeout(sync,1500)}
const win=(b,a)=>!!b._p!==!!a._p?!!b._p:b._ts>a._ts;
function merge(r){let n=0;for(const k in r)if(!DB.items[k]||win(r[k],DB.items[k])){DB.items[k]=r[k];n++}if(n)save();return n}
/* synchro GitHub : lire → fusionner → réécrire (jamais d'écrasement) */
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s)));
function api(m,b){const g=DB.gh,u=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path.split('/').map(encodeURIComponent).join('/')}`,h={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
return fetch(m==='GET'?u+'?ref='+encodeURIComponent(g.branch):u,m==='GET'?{headers:h}:{method:m,headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(b)})}
function msg(t){msgT=t;$('#st').textContent=t}
async function sync(manual){const g=DB.gh;if(!g.token||!g.owner||!g.repo){if(manual)cfg();return}if(busy)return;busy=1;msg('…');
try{for(let i=0;i<3;i++){let sha,r=await api('GET');if(r.status===200){const j=await r.json();sha=j.sha;dirty+=merge(JSON.parse(dec(j.content.replace(/\n/g,''))).items||{})}else if(r.status!==404)throw Error('GitHub '+r.status);
const p=await api('PUT',{message:'sync '+new Date().toISOString(),content:enc(JSON.stringify({items:DB.items})),branch:g.branch,sha});
if(p.ok){msg('✅ '+tm(Date.now()));if(dirty&&!$('#mb')&&(manual||['hist','prof'].includes(tab))){dirty=0;render()}return}
if(p.status!==409&&p.status!==422)throw Error('GitHub '+p.status)}}catch(e){msg('❌ '+e.message)}finally{busy=0}}
function cfg(){const g=DB.gh;modal(`<h2>Synchronisation GitHub</h2><p class="sub">Tous les appareils doivent utiliser le même dépôt (privé), chemin et token.</p>
<label>Propriétaire</label><input id="g1" value="${esc(g.owner)}"><label>Dépôt</label><input id="g2" value="${esc(g.repo)}"><label>Branche</label><input id="g3" value="${esc(g.branch)}"><label>Chemin du fichier</label><input id="g4" value="${esc(g.path)}"><label>Token (Contents : Read and write)</label><input id="g5" type="password" value="${esc(g.token)}">
<button class="btn" onclick="saveCfg()">Enregistrer</button><button class="btn out" onclick="closeM()">Fermer</button>`)}
function saveCfg(){DB.gh={owner:$('#g1').value.trim(),repo:$('#g2').value.trim(),branch:$('#g3').value.trim()||'main',path:$('#g4').value.trim()||'escalade-data.json',token:$('#g5').value.trim()};save();closeM();sync(1)}
function modal(h){closeM();const d=document.createElement('div');d.id='mb';d.innerHTML='<div class="card">'+h+'</div>';document.body.appendChild(d)}
function closeM(){const e=$('#mb');if(e)e.remove()}
/* navigation et mot de passe prof */
function unlock(f){if(PROF)return f();const c=DB.items.cfg;
if(!c){const p=prompt('Première utilisation : choisis le mot de passe prof');if(!p||!p.trim())return;PROF=true;put({id:'cfg',t:'cfg',hash:H(p.trim())});return f()}
const p=prompt('Mot de passe prof');if(p===null)return;if(H(p.trim())!==c.hash)return alert('Mot de passe incorrect.');PROF=true;f()}
function go(t){if((t==='prof'||t==='gest')&&!PROF)return unlock(()=>go(t));tab=t;openH=null;openC=null;render()}
function render(){const y=scrollY;$('#app').innerHTML=({home:vHome,stu:vStu,prof:vProf,hist:vHist,gest:vGest})[tab]();$('#st').textContent=msgT;scrollTo(0,y)}
function vHome(){const t=(k,i,n,d,c)=>`<div class="tile" onclick="go('${k}')"><i style="color:${c}">${i}</i><b>${n}</b><div class="sub">${d}</div></div>`;
return `<div style="text-align:center;margin:10px 0 20px"><div style="font-size:56px">🧗</div><h2>Escalade EPS</h2><div class="sub">Suivi des séances d'escalade</div></div><div class="tiles">${t('stu','🧗','Mode Élève','Enregistrer une voie','var(--rope)')}${t('prof','👨‍🏫','Mode Prof','Séances et brevets','var(--wall)')}${t('hist','📊','Historique','Voies et bilans','var(--rope)')}${t('gest','⚙️','Gestion','Classes et élèves','var(--wall)')}</div>`}
/* ÉLÈVE */
function vStu(){const s=act();if(!s)return empty('Aucune séance en cours','Ton prof doit démarrer la séance.');
if(!me){const cl=L('stu').filter(x=>x.cls===s.cls).sort(nm);return `<div class="card"><h2>Connexion</h2><label>Élève</label><select id="ls">${cl.map(x=>`<option value="${x.id}">${esc(full(x))}</option>`).join('')}</select><label>PIN (4 chiffres)</label><input id="lp" type="password" inputmode="numeric" maxlength="4"><button class="btn" onclick="login()">Entrer</button></div>`}
const st=DB.items[me];if(!st||dq(s.id,me))return `<div class="card"><h2>⛔ Accès refusé</h2><p>Tu es disqualifié(e) pour cette séance.</p><button class="btn out" onclick="logout()">Quitter</button></div>`;
if(W.done)return `<div class="card" style="text-align:center"><h2>🎉 Bravo ${esc(st.fn)} !</h2><p>Ta voie est enregistrée (elle compte pour toute la cordée).</p><button class="btn" onclick="newW()">Nouvelle voie</button><button class="btn out" onclick="logout()">Quitter</button></div>`;
let b='';const cl=L('stu').filter(x=>x.cls===s.cls&&x.id!==me).sort(nm);
if(W.step==0)b=`<label>N° de la voie (étiquette du mur)</label><input id="w1" inputmode="numeric" value="${esc(W.route)}"><label>Difficulté</label><select id="w2">${GR.map(g=>`<option ${g==W.grade?'selected':''}>${g}</option>`).join('')}</select>`;
if(W.step==1)b=`<label>Hauteur maximale atteinte (m)</label><input id="w3" type="number" step="0.5" value="${esc(W.h)}">`;
if(W.step==2)b='<label>Ton rôle</label>'+['g','a','c'].map(r=>{const k=stat(me,r);return `<button class="pick" ${k=='ok'?'':'disabled'} onclick="pickR('${r}')">${BR[r].i} ${BR[r].n} <span class="bd ${k}">${SL[k]}</span></button>`}).join('')||'';
if(W.step==3)b=`<p>Tu es <b>${BR[W.role].n}</b>. Qui sont tes camarades de cordée ?</p>`+['g','a','c'].filter(r=>r!=W.role).map(r=>`<label>${BR[r].n}${r=='c'?' (optionnel)':''}</label><select id="w_${r}"><option value="">—</option>${cl.filter(x=>stat(x.id,r)=='ok'&&!dq(s.id,x.id)).map(x=>`<option value="${x.id}">${esc(full(x))}</option>`).join('')}</select>`).join('');
return `<div class="card"><h2>${esc(full(st))} — étape ${W.step+1}/4</h2>${b}<div>${W.step?'<button class="btn out" onclick="W.step--;render()">←</button>':''}${W.step<2?'<button class="btn" onclick="nx()">Suivant</button>':''}${W.step==3?'<button class="btn" onclick="finish()">✔ Enregistrer</button>':''}<button class="btn out" onclick="logout()">Quitter</button></div></div>`}
const newW=()=>{W={step:0,route:'',grade:'5a',h:'',role:''};render()},logout=()=>{me=null;W=null;render()};
function login(){const st=DB.items[$('#ls').value];if(!st||st.pin!==$('#lp').value.trim())return alert('PIN incorrect.');me=st.id;newW()}
function nx(){if(W.step==0){W.route=$('#w1').value.trim();W.grade=$('#w2').value;if(!W.route)return alert('Numéro de voie ?')}if(W.step==1){W.h=$('#w3').value;if(!(+W.h>0))return alert('Hauteur ?')}W.step++;render()}
const pickR=r=>{W.role=r;W.step=3;render()};
function finish(){const s=act(),m={g:'',a:'',c:''};m[W.role]=me;for(const r of 'gac')if(r!=W.role)m[r]=$('#w_'+r).value;
const ids=Object.values(m).filter(Boolean);if(!m.g||!m.a||new Set(ids).size!=ids.length)return alert('Il faut au moins un grimpeur et un assureur, différents.');
put({id:'cl|'+s.id+'|'+W.route+'|'+W.h+'|'+ids.slice().sort().join(','),t:'climb',ses:s.id,route:W.route,grade:W.grade,h:W.h,m,by:me,st:'p',ts0:Date.now()});W.done=1;render()}
/* lignes de voies */
const SC={p:['en','À valider'],o:['ok','Validée'],r:['no','Rejetée']};
function crow(c,p){const [k,l]=SC[c.st]||SC.p;return `<div class="row" style="cursor:pointer" onclick="showC('${c.id}')"><span><span class="bd vo">${esc(c.route)}</span> <span class="bd gr">${esc(c.grade)}</span> <b>${esc(nf(c.m.g))}</b> <span class="sub">assuré par ${esc(nf(c.m.a))}${c.m.c?' · contre : '+esc(nf(c.m.c)):''} · ${esc(c.h)} m · ${tm(c.ts0)}</span></span><span onclick="event.stopPropagation()"><span class="bd ${k}">${l}</span>${p?`<button class="btn" onclick="setSt('${c.id}','o')">✓</button><button class="btn ko" onclick="setSt('${c.id}','r')">✗</button>`:''}</span></div>`}
const setSt=(id,st)=>{put({...DB.items[id],st});render()};
function showC(id){const c=DB.items[id];modal(`<h2>Voie ${esc(c.route)} · ${esc(c.grade)}</h2><p>Hauteur : <b>${esc(c.h)} m</b><br>Heure : ${dt(c.ts0)}<br>Saisie par : ${esc(nf(c.by))}</p>${['g','a','c'].filter(r=>c.m[r]).map(r=>`<p>${BR[r].i} ${BR[r].n} : <b>${esc(nf(c.m[r]))}</b></p>`).join('')}<button class="btn out" onclick="closeM()">Fermer</button>`)}
/* PROF */
function vProf(){const s=act();let h='<div class="card"><h2>Séance</h2>';
if(s){h+=`<p><b>${esc(cn(s.cls))}</b> — en cours depuis ${dt(s.ts0)}</p><button class="btn ko" onclick="endSes()">Terminer la séance</button>`}
else h+=`<select id="nc">${L('cls').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn" onclick="startSes()">Démarrer</button>`;h+='</div>';
if(s){const cs=L('climb').filter(c=>c.ses===s.id).sort((a,b)=>b.ts0-a.ts0);
h+=`<div class="card"><h2>Voies en direct (${cs.length})</h2>${cs.map(c=>crow(c,1)).join('')||'<p class="sub">Aucune voie saisie.</p>'}</div>`;
h+=`<div class="card"><h2>Disqualifications</h2>${L('stu').filter(x=>x.cls===s.cls).sort(nm).map(x=>{const d=dq(s.id,x.id);return `<div class="row"><span>${esc(full(x))} ${d?'<span class="bd no">Disqualifié</span>':''}</span><button class="btn ${d?'out':'ko'}" onclick="setDq('${s.id}','${x.id}',${!d})">${d?'Rétablir':'Disqualifier'}</button></div>`}).join('')}</div>`}
const cid=pv.cls||(s&&s.cls)||(L('cls')[0]||{}).id,ss=L('stu').filter(x=>x.cls===cid).sort(nm),sid=pv.stu&&DB.items[pv.stu]&&DB.items[pv.stu].cls===cid?pv.stu:(ss[0]||{}).id;
h+=`<div class="card"><h2>Brevets</h2><select onchange="pv={cls:this.value};render()">${L('cls').map(c=>`<option value="${c.id}" ${c.id==cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select onchange="pv={cls:'${cid}',stu:this.value};render()">${ss.map(x=>`<option value="${x.id}" ${x.id==sid?'selected':''}>${esc(full(x))}</option>`).join('')}</select>`;
if(sid)for(const b of 'gac'){const k=stat(sid,b);h+=`<div class="row"><b>${BR[b].i} ${BR[b].n}</b><span><span class="bd ${k}">${SL[k]}</span><button class="btn out" onclick="susp('${sid}','${b}')">${k=='sus'?'Lever la suspension':'Suspendre'}</button></span></div>`+comps(b).map(c=>`<label class="ck"><input type="checkbox" ${(DB.items['r|'+sid+'|'+c[0]]||{}).v?'checked':''} onchange="tick('${sid}','${c[0]}',this.checked)"><span><b>${c[0]}</b> ${esc(c[1])}</span></label>`).join('')}
else h+='<p class="sub">Aucun élève dans cette classe.</p>';return h+'</div>'}
const startSes=()=>{const c=$('#nc').value;if(!c)return alert("Crée d'abord une classe (mode Gestion).");put({id:uid('ses'),t:'ses',cls:c,on:true,ts0:Date.now()});render()};
const endSes=()=>{if(confirm('Terminer la séance ?')){put({...act(),on:false,ts1:Date.now()});render()}};
const setDq=(s,i,v)=>{put({id:'dq|'+s+'|'+i,t:'dq',ses:s,sid:i,v});render()};
const tick=(i,c,v)=>{put({id:'r|'+i+'|'+c,t:'rec',sid:i,code:c,v});render()};
const susp=(i,b)=>{put({id:'s|'+i+'|'+b,t:'sus',sid:i,b,v:!(DB.items['s|'+i+'|'+b]||{}).v});render()};
/* HISTORIQUE */
function vHist(){if(openH&&DB.items[openH]){const s=DB.items[openH],cs=L('climb').filter(c=>c.ses===s.id).sort((a,b)=>b.ts0-a.ts0),ok=cs.filter(c=>c.st!='r');
const n=(i,r)=>ok.filter(c=>c.m[r]===i).length,ss=L('stu').filter(x=>x.cls===s.cls).sort(nm),nd=L('dq').filter(d=>d.ses===s.id&&d.v).length;
return `<div class="card"><button class="btn out" onclick="openH=null;render()">← Séances</button><h2>${esc(cn(s.cls))} — ${dt(s.ts0)}</h2><span class="bd ${s.on?'en':'ok'}">${s.on?'En cours':'Clôturée'}</span> <span class="bd">${ok.length} voie(s)</span> <span class="bd ${nd?'no':''}">${nd} disqualif.</span></div>
<div class="card"><table><tr><th>Élève</th><th>Grimpées</th><th>Assurées</th><th>Contre-ass.</th></tr>${ss.map(x=>`<tr><td>${esc(full(x))}</td><td>${n(x.id,'g')}</td><td>${n(x.id,'a')}</td><td>${n(x.id,'c')}</td></tr>`).join('')}</table></div>
<div class="card"><h2>Voies</h2>${cs.map(c=>crow(c,0)).join('')||'<p class="sub">Aucune voie.</p>'}</div>`}
const ss=L('ses').sort((a,b)=>b.ts0-a.ts0);
return `<div class="card"><h2>Historique</h2>${ss.map(s=>`<div class="row" style="cursor:pointer" onclick="openH='${s.id}';render()"><span><b>${esc(cn(s.cls))}</b> <span class="sub">${dt(s.ts0)} · ${L('climb').filter(c=>c.ses===s.id&&c.st!='r').length} voie(s)</span></span><span class="bd ${s.on?'en':'ok'}">${s.on?'En cours':'Clôturée'}</span></div>`).join('')||empty('Aucune séance','')}</div>`}
/* GESTION */
function vGest(){const c=DB.items[openC];
if(c&&!c._d){const ss=L('stu').filter(x=>x.cls===c.id).sort(nm);
return `<div class="card"><button class="btn out" onclick="openC=null;render()">← Classes</button><h2>${esc(c.name)}</h2><button class="btn out" onclick="renCls()">✏️ Renommer</button><button class="btn ko" onclick="delCls()">🗑 Supprimer la classe</button></div>
<div class="card"><h2>Ajouter un élève</h2><label>Prénom</label><input id="gf"><label>Nom de famille (optionnel)</label><input id="gl"><label>Genre (optionnel)</label><select id="gg"><option value="">—</option><option value="F">Fille</option><option value="G">Garçon</option></select><button class="btn" onclick="addStu()">➕ Ajouter</button><button class="btn bl" onclick="addMany()">Ajouter plusieurs</button></div>
<div class="card"><h2>Élèves (${ss.length})</h2>${ss.map(x=>`<div class="row"><span><b>${esc(full(x))}</b> <span class="sub">${x.g||''} · PIN ${esc(x.pin)}</span></span><span><button class="btn out" onclick="edStu('${x.id}')">✏️</button><button class="btn out" onclick="pinStu('${x.id}')">🔑</button><button class="btn ko" onclick="delStu('${x.id}')">🗑</button></span></div>`).join('')||empty('Aucun élève','')}</div>`}
return `<div class="card"><div class="row" style="border:0"><h2>Classes</h2><button class="btn" onclick="newCls()">➕ Nouvelle classe</button></div>${L('cls').map(c=>`<div class="row" style="cursor:pointer" onclick="openC='${c.id}';render()"><b>${esc(c.name)}</b><span class="sub">${L('stu').filter(x=>x.cls===c.id).length} élève(s)</span></div>`).join('')||empty('Aucune classe','Crée ta première classe.')}</div>`}
function newCls(){const n=prompt('Nom de la nouvelle classe (ex : 3e2)');if(!n||!n.trim())return;if(L('cls').some(c=>c.name.toLowerCase()==n.trim().toLowerCase()))return alert('Une classe avec ce nom existe déjà.');put({id:uid('cls'),t:'cls',name:n.trim()});render()}
function renCls(){const n=prompt('Nouveau nom',DB.items[openC].name);if(n&&n.trim()){put({...DB.items[openC],name:n.trim()});render()}}
function delCls(){if(!confirm('Supprimer la classe et ses élèves ?'))return;L('stu').filter(x=>x.cls===openC).forEach(x=>put({...x,_d:true}));put({...DB.items[openC],_d:true});openC=null;render()}
function newPin(c){const u=L('stu').filter(x=>x.cls===c).map(x=>x.pin);let p;do{p=String(Math.floor(Math.random()*10000)).padStart(4,'0')}while(u.includes(p));return p}
function addStu(){const fn=$('#gf').value.trim();if(!fn)return alert('Prénom ?');put({id:uid('stu'),t:'stu',cls:openC,fn,ln:$('#gl').value.trim(),g:$('#gg').value,pin:newPin(openC)});render()}
function addMany(){const v=prompt('Prénoms séparés par espace, virgule, point-virgule ou retour à la ligne');if(!v)return;v.split(/[\s,;\/_]+/).filter(Boolean).forEach(fn=>put({id:uid('stu'),t:'stu',cls:openC,fn,ln:'',g:'',pin:newPin(openC)}));render()}
function edStu(id){const x=DB.items[id],fn=prompt('Prénom',x.fn);if(!fn||!fn.trim())return;const ln=prompt('Nom (optionnel)',x.ln||''),g=prompt('Genre : F ou G (vide = aucun)',x.g||'');put({...x,fn:fn.trim(),ln:(ln||'').trim(),g:/^[FG]$/i.test((g||'').trim())?g.trim().toUpperCase():''});render()}
function pinStu(id){const x=DB.items[id],v=prompt('Nouveau PIN à 4 chiffres (vide = code aléatoire)');if(v===null)return;let p=v.trim();
if(!p)p=newPin(x.cls);else if(!/^\d{4}$/.test(p))return alert('Le PIN doit contenir exactement 4 chiffres.');else if(L('stu').some(y=>y.cls==x.cls&&y.id!=id&&y.pin==p))return alert('Ce PIN est déjà pris dans la classe.');put({...x,pin:p});render()}
function delStu(id){if(confirm('Supprimer cet élève ?')){put({...DB.items[id],_d:true});render()}}
render();setInterval(()=>{if(!document.hidden)sync()},20000);sync();
</script></body></html>
