<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPS Run</title>
<style>
/* Thème : clair par défaut, sombre au choix. Couleurs par catégorie via --c. Mise en page fluide : téléphone, tablette, ordinateur. */
:root{--bg:#eef2f6;--card:#fff;--tx:#18212f;--mut:#5b6678;--ac:#0f766e;--ac2:#2563eb;--acx:#fff;--bd:#d5dce6;--bad:#c2261c;--sh:0 1px 2px #0f172a14,0 4px 14px #0f172a0f;--r:14px}
[data-theme=dark]{--bg:#0f141b;--card:#1a212b;--tx:#e8edf4;--mut:#9aa6b8;--ac:#2dd4bf;--ac2:#60a5fa;--acx:#04201c;--bd:#2c3644;--bad:#fb7185;--sh:0 1px 2px #0006,0 4px 14px #0004}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
h2{margin:.3em 0 .6em;font-size:clamp(1.3rem,3.5vw,1.8rem)}h3{margin:.4em 0 .6em}h4{margin:.8em 0 .3em}a{color:var(--ac2)}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:42px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.5em .95em;cursor:pointer;box-shadow:var(--sh);transition:transform .12s,filter .12s}
button:hover:not(:disabled){filter:brightness(.97)}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.45;cursor:default;box-shadow:none}
button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acx);border-color:transparent;font-weight:600}
[data-theme=dark] button.pri{color:#04201c}button.dan{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
input,select,textarea{width:100%;min-height:42px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:.5em .7em}
label{display:block;margin:.7em 0 .25em;color:var(--mut);font-size:.9rem}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-left));background:linear-gradient(120deg,#0f766e,#2563eb);color:#fff}
#top b{flex:1;font-size:1.2rem;letter-spacing:.02em}#top button{background:#ffffff26;color:#fff;border-color:#ffffff40;box-shadow:none;min-height:38px}
.screen{display:none;padding:14px;max-width:920px;margin:auto}.screen.active{display:block}#home{max-width:1180px}
.hello{background:var(--card);border-left:5px solid var(--ac);border-radius:var(--r);padding:.8em 1em;box-shadow:var(--sh)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:.6em 0;align-items:center}.row.end{justify-content:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.group{display:flex;align-items:center;gap:.5em;margin:1.3em 0 .5em;font-weight:700;font-size:1.05rem;color:var(--c,var(--mut))}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:.9em 1em;border-radius:var(--r);border:1px solid var(--bd);border-top:5px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,var(--card)),var(--card))}
.card .ic{font-size:2rem;line-height:1.1}.card b{font-size:1.02rem}.card small{color:var(--mut);line-height:1.3}.card:hover:not(:disabled){transform:translateY(-2px)}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;padding:.8em 1em;text-align:left}
.stu{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:.6em .8em;margin-bottom:6px;background:var(--card);border-radius:12px;box-shadow:var(--sh)}.stu .n{flex:1;min-width:10em}.stu small,.empty{color:var(--mut)}
#modal{position:fixed;inset:0;background:#0a0f1a99;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;backdrop-filter:blur(2px)}#modal[hidden],[hidden]{display:none!important}
.box{background:var(--card);border-radius:18px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0008}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:#18212f;color:#fff;padding:.7em 1.1em;border-radius:12px;opacity:0;transition:.2s;z-index:30;max-width:92vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.lv{width:100%;border-collapse:collapse}.lv th{color:var(--mut);font-size:.8rem;text-align:left;padding:4px 6px;border-bottom:2px solid var(--bd)}.lv td{padding:4px 6px;font-size:.92rem;border-bottom:1px solid var(--bd)}.lv input,.lv select{min-height:34px;padding:.25em .4em}.lv td:first-child,.lv td:nth-child(4){min-width:64px}
.scroll{overflow-x:auto}.chip{border-radius:8px;padding:.15em .6em;color:#fff;text-shadow:0 1px 2px #0007;white-space:nowrap;font-size:.88rem}
.gc{box-shadow:var(--sh)}.ccs{cursor:pointer}.ccs.done{opacity:.65}.ccs .ex button{min-width:40px}
.rk{background:var(--card);border-radius:12px;margin:6px 0;box-shadow:var(--sh)}.rk summary{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:.65em .9em;cursor:pointer}.rk .nm{font-weight:700;min-width:6em}.rk .dt{padding:0 .9em .9em}.sp{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
/* Compteurs */
#counterMain.active{display:flex;flex-direction:column;height:calc(100dvh - 54px);max-width:none;padding:8px;gap:8px}
#boxes{flex:1;display:grid;gap:10px;min-height:0}
.tbox{container-type:size;position:relative;border-radius:20px;color:#fff;padding:10px 12px;display:flex;flex-direction:column;cursor:pointer;overflow:auto;text-shadow:0 1px 3px #0007;box-shadow:inset 0 -60px 80px -50px #0005,var(--sh);user-select:none}
.tbox .th{display:flex;align-items:center;gap:10px;font-size:clamp(1rem,2.6vmin,1.5rem)}.tbox .th>b{flex:none}.tbox .th .ico{margin-left:auto}
.who{flex:1;min-width:0;text-align:center;font-weight:800;font-size:clamp(1.3rem,min(11cqh,5cqw),3rem);background:#fff;color:#18212f;text-shadow:none;border-radius:999px;padding:.05em .7em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mem:empty{display:none}
.tbox .big{font-size:clamp(3rem,16vmin,9rem);font-size:clamp(2.5rem,min(34cqh,22cqw),9rem);font-weight:800;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;line-height:1}
.ico{background:#00000040;color:#fff;border:0;padding:.3em .7em;box-shadow:none}.minus{position:absolute;left:10px;bottom:10px;font-size:1.3rem;min-width:44px}
.mem{display:flex;flex-wrap:wrap;gap:6px;margin-left:56px;min-height:1.8em}
.tag{display:inline-block;background:#fff;color:#18212f;text-shadow:none;border-radius:999px;padding:.2em .8em;font-size:1rem;border:2px solid transparent;cursor:pointer}.tag.on{border-color:#000;background:#fde68a}.tag i{font-style:normal;font-weight:800;margin-left:.2em}
.tbox .tag{font-size:clamp(1.1rem,3.4vmin,1.8rem);padding:.15em .85em}
.unas{font-size:.95rem;color:var(--mut);max-height:18vh;overflow:auto}.unas .tag{background:var(--card);color:var(--tx);border-color:var(--bd);margin:3px}.unas .tag.on{background:#fde68a;color:#18212f;border-color:#000}
.bar{display:flex;gap:6px;flex-wrap:wrap}.bar button{display:flex;align-items:center;gap:.4em;padding:.4em .75em}.bar i{font-style:normal;font-size:1.15rem}
.arr{position:absolute;background:#000b;color:#fff;border:0;font-size:1.5rem;width:52px;height:52px;margin:auto;padding:0}.arr.up{top:6px;left:0;right:0}.arr.down{bottom:6px;left:0;right:0}.arr.left{left:6px;top:0;bottom:0}.arr.right{right:6px;top:0;bottom:0}
.ex{display:flex;gap:8px;align-items:center;justify-content:center;font-size:1.1rem}.prec{align-self:center;margin:4px 0}
#wtabs{margin:0;overflow-x:auto;flex-wrap:nowrap}#wtabs button{white-space:nowrap}
#tmChip{position:fixed;top:60px;right:10px;z-index:8;background:#18212f;color:#fff;border-radius:14px;padding:6px 10px;display:flex;gap:6px;align-items:center;box-shadow:var(--sh);font-size:1.1rem}#tmChip b{font-size:1.5rem}#tmChip button{min-height:34px;padding:.2em .6em;background:#ffffff22;color:#fff;border-color:#ffffff33}
@media (max-width:700px){.screen{padding:10px}.bar span{display:none}.bar .pri span,.bar .dan span{display:inline}.grid{grid-template-columns:1fr 1fr}.card .ic{font-size:1.6rem}.card small{display:none}.mem{margin-left:50px}#tmChip{top:54px;font-size:1rem}}
@media (max-width:420px){.grid{grid-template-columns:1fr}.card small{display:block}}
@media (min-width:1000px){.screen{padding:20px}.bar button{padding:.5em 1em}}
@media (orientation:landscape) and (max-height:520px){#top{padding-top:4px;padding-bottom:4px}#counterMain.active{height:calc(100dvh - 46px)}.tbox .big{font-size:clamp(2.5rem,22vmin,7rem)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.gsw{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden}.gsw button{border:0;border-radius:0;box-shadow:none;min-width:48px;font-size:1.25rem;background:var(--bg);color:var(--mut)}.gsw .on.f{background:#db2777;color:#fff}.gsw .on.m{background:#2563eb;color:#fff}
.spd{display:flex;align-items:center;gap:6px;margin:0}.spd input{width:5.5em}.stu.head{background:none;box-shadow:none;color:var(--mut);font-size:.8rem;padding-bottom:0}.stu.head>span:not(.n){min-width:96px}
</style></head><body>
<header id="top"><button id="menuBtn" hidden onclick="show('home')">🏠 Menu</button><b>🏃 EPS Run</b><button id="themeBtn" onclick="toggleTheme()" aria-label="Thème clair ou sombre"></button></header>
<div id="home" class="screen active"></div>
<div id="classes" class="screen"><h2>Classes</h2><div class="row"><button class="pri" onclick="addClass()">+ Nouvelle classe</button></div><div id="classList"></div></div>
<div id="classDetail" class="screen"><div class="row"><button onclick="show('classes')">← Classes</button></div><h2 id="cdName"></h2>
<div class="row"><button class="pri" onclick="editStudent()">+ Élève</button><button onclick="addMany()">+ Liste d'élèves</button><button onclick="renameClass()">Renommer</button><button class="dan" onclick="deleteClass()">Supprimer la classe</button></div><div id="stuList"></div></div>
<div id="baremes" class="screen"><h2>Barèmes</h2><p class="empty">Dupliquez un barème pour en créer un nouveau, puis modifiez niveaux, couleurs et notes.</p><div id="bareList"></div></div>
<div id="baremeEdit" class="screen"><div class="row"><button onclick="show('baremes')">← Annuler</button><button class="pri" onclick="saveBareme()">Enregistrer</button></div><div id="bareForm"></div></div>
<div id="counterSetup" class="screen"><div class="row"><button onclick="show('home')">← Menu</button></div><h2 id="csTitle"></h2><p>Nombre d'équipes</p><div class="row"><button onclick="csN(-1)" aria-label="Moins">−</button><b id="csN" style="font-size:2rem;min-width:2ch;text-align:center"></b><button onclick="csN(1)" aria-label="Plus">+</button></div><div class="row"><button class="pri" onclick="csStart()">Démarrer</button></div></div>
<div id="counterMain" class="screen"><div id="wtabs" class="row" hidden></div><div id="boxes"></div><div id="unas" class="unas"></div><div class="bar"><button onclick="show('home')"><i>🏠</i><span>Menu</span></button><button id="cUndo" onclick="undo()"><i>↩️</i><span>Annuler</span></button><button id="cRedo" onclick="redoIt()"><i>↪️</i><span>Rétablir</span></button><button onclick="cReset()"><i>0️⃣</i><span>À zéro</span></button><button id="cList" onclick="cList()"><i>📋</i><span>Liste</span></button><button id="cClass" onclick="cClass()"><i>🏫</i><span>Classe</span></button><button id="cSet" onclick="cSet()"><i>⚙️</i><span>Réglages</span></button><button onclick="cTimer()"><i>⏱️</i><span>Minuteur</span></button><button id="cOrg" onclick="cOrg()"><i>🔀</i><span>Organiser</span></button><button id="cStart" class="pri" onclick="cStart()"><i>▶️</i><span>Début de séance</span></button><button class="dan" onclick="cEnd()"><i>🏁</i><span>Fin</span></button><button onclick="cHist()"><i>🕘</i><span>Historique</span></button></div></div>
<div id="tmChip" hidden><b id="tmTime"></b> <small id="tmTot"></small> <button id="tmPlay" onclick="tmPlay()">▶</button><button onclick="tmReset()" aria-label="Remettre au départ">↺</button><button onclick="tmClose()" aria-label="Fermer le minuteur">✕</button></div>
<div id="history" class="screen"></div>
<div id="fract" class="screen"></div>
<div id="stadium" class="screen"></div>
<div id="ccmCfg" class="screen"></div><div id="ccmRace" class="screen"></div>
<div id="modal" hidden></div><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// Stockage : les clés localStorage sont toutes ici
const KEYS={db:'epsrun_db',settings:'epsrun_settings'};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v));}
// DB = données synchronisées (classes, séances, barèmes) ; SET = réglages propres à l'appareil (thème, GitHub)
const newDB=()=>({classes:[],sessions:[],baremes:[],activeBareme:{},classBareme:{}});
let DB={...newDB(),...lsGet(KEYS.db,{})};
const SET={theme:null,github:{token:'',repo:''},biat:{throwSec:7,penSec:3,shots:3},...lsGet(KEYS.settings,{})};
const saveDB=()=>lsSet(KEYS.db,DB),saveSet=()=>lsSet(KEYS.settings,SET);
if(SET.df){SET.courses={...SET.courses,dfEval:SET.df.courses};delete SET.df;saveSet();}
// Prénoms : tout caractère qui n'est ni une lettre ni un tiret sépare deux prénoms (« Jean Pierre » = 2, « Jean-Pierre » = 1)
const parseNames=t=>t.split(/[^\p{L}\p{M}-]+/u).map(n=>n.replace(/^-+|-+$/g,'')).filter(Boolean);
const NAMES_HELP='Séparez les prénoms par un espace, une virgule ou un retour à la ligne. « Jean-Pierre » (avec un tiret) reste un seul prénom.';
const getClass=id=>DB.classes.find(c=>c.id===id);
const studentName=s=>s.firstName+(s.lastName?' '+s.lastName:'');
// Navigation : SCREENS[id] est appelée à l'ouverture de l'écran ; un mode sans écran enregistré reste grisé à l'accueil
const SCREENS={};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));$('menuBtn').hidden=id==='home';if(SCREENS[id])SCREENS[id]();}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400);}
function modal(title,body,btns=[{label:'Fermer'}]){
  const m=$('modal');m.innerHTML=`<div class="box"><h3>${esc(title)}</h3>${body}<div class="row end"></div></div>`;
  btns.forEach(b=>{const e=document.createElement('button');e.textContent=b.label;e.className=b.primary?'pri':b.danger?'dan':'';
    e.onclick=()=>{if(!b.fn||b.fn()!==false)closeModal();};m.querySelector('.row').append(e);});
  m.hidden=false;const f=m.querySelector('input,textarea,select');if(f)f.focus();
}
const closeModal=()=>{$('modal').hidden=true;$('modal').innerHTML='';};
const ask=(msg,fn,label='Confirmer')=>modal('Confirmation',`<p>${esc(msg)}</p>`,[{label:'Annuler'},{label,danger:true,fn}]);
function applyTheme(){const t=SET.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=t;$('themeBtn').textContent=t==='dark'?'☀️':'🌙';}
function toggleTheme(){SET.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';saveSet();applyTheme();}
// Accueil : chaque mode est expliqué en une ligne ; un mode sans écran enregistré reste grisé
const HOME=[['Compteurs','#2563eb','🔢',[['counterTeam','Compteur par équipe','Comptez les tours de chaque équipe et obtenez la distance totale.','👥'],['counterIndiv','Compteur indiv/équipe','Tours par équipe et par élève.','🏅']]],
  ['Piste','#16a34a','🏟️',[['stadium','Calculateur Stadium','Tracez une piste sur n\'importe quel terrain et calculez les allures.','📐']]],
  ['Course de durée','#ea580c','⏱️',[['dfEval','Évaluation par vagues','Courses de durée fixe, un élève par équipe à la fois, avec barème.','🏃'],['dfCcm','Contre-la-montre','Chaque élève court une distance donnée, on chronomètre.','⏲️']]],
  ['Fractionné','#7c3aed','🔁',[['fract','Séance fractionné','Groupes de vitesse, blocs d\'effort et de récupération, bande-son.','📣']]],
  ['Biathlon (course + lancers)','#e11d48','🎯',[['biatIndiv','Biathlon individuel','Évaluation élève par élève, avec barème.','🥇'],['biatTeam','Biathlon équipe','Tours et lancers manqués par équipe.','🤝'],['biatCcm','Biathlon contre-la-montre','Pénalités en secondes ou en tours.','🔥']]],
  ['Outils','#0f766e','🧰',[['classes','Gestion de classe','Vos classes et vos élèves (genre et vitesse cible facultatifs).','🏫'],['baremes','Barèmes','Couleurs, notes ou les deux : vous décidez.','🎨'],['history','Historique des séances','Retrouvez les séances enregistrées.','🕘']]]];
const ghOn=()=>SET.github.token&&SET.github.repo;
SCREENS.home=()=>{$('home').innerHTML=`<p class="hello">Première visite ? Commencez par <b>🏫 Gestion de classe</b>, puis choisissez un mode. <a href="#" onclick="help();return false">Aide rapide</a></p>`+HOME.map(([g,c,e,l])=>`<div class="group" style="--c:${c}">${e} ${g}</div><div class="grid">${l.map(([id,n,d,ic])=>`<button class="card" style="--c:${c}" ${SCREENS[id]?`onclick="show('${id}')"`:'disabled title="Bientôt disponible"'}><span class="ic">${ic}</span><b>${n}</b><small>${d}</small></button>`).join('')}</div>`).join('')
  +`<div class="group" style="--c:#64748b">💾 Sauvegarde</div><p class="empty">Tout est enregistré sur cet appareil. Exportez un fichier pour sauvegarder ou changer d'appareil.</p><div class="row"><button onclick="exportFile()">📤 Exporter un fichier</button><button onclick="$('importFile').click()">📥 Importer un fichier</button>
  ${ghOn()?'<button onclick="syncSend()">Envoyer vers GitHub</button><button onclick="syncReceive()">Recevoir depuis GitHub</button><button onclick="configGitHub()">Réglages GitHub</button>':'<button onclick="configGitHub()">Synchronisation GitHub (facultatif)</button>'}</div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importFile(this)">`;};
function exportFile(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'epsrun',version:1,db:DB})],{type:'application/json'}));a.download='epsrun-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Fichier exporté.');}
function importFile(inp){const f=inp.files[0];inp.value='';if(!f)return;f.text().then(t=>{let o;try{o=JSON.parse(t);}catch(e){}
  if(!o||!o.db||!Array.isArray(o.db.classes))return toast('Ce fichier n\'est pas une sauvegarde EPS Run.');
  ask('Importer remplace toutes les données de cet appareil par celles du fichier.',()=>{DB={...newDB(),...o.db};saveDB();show('home');toast('Sauvegarde importée.');},'Importer');});}
const help=()=>modal('Aide rapide',`<ol><li><b>Gestion de classe</b> : créez une classe et ajoutez vos élèves (en liste, un par ligne).</li><li><b>Barèmes</b> : adaptez les niveaux, couleurs et notes, ou gardez ceux proposés.</li><li>Choisissez un <b>mode</b> : équipes, vagues ou contre-la-montre. Un clic sur une équipe ou un élève ajoute un tour.</li><li><b>Fin</b> : indiquez la taille de la piste (distance d'un tour) pour obtenir distances, vitesses et notes.</li><li>Les séances sont gardées dans l'<b>Historique</b>. Exportez un fichier de temps en temps pour ne rien perdre.</li></ol>`);

// Synchro GitHub : même principe que tournois-eps (tout envoyer / tout recevoir). Seule DB part dans le fichier : le token reste sur l'appareil.
const GH_FILE='epsrun-data.json';
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
async function gh(method,body){
  const{token,repo}=SET.github;
  if(!token||!repo){configGitHub();throw new Error('Renseignez le dépôt et le token GitHub.');}
  const r=await fetch(`https://api.github.com/repos/${repo}/contents/${GH_FILE}`,{method,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
  if(r.status===404&&method==='GET')return null;
  if(!r.ok)throw new Error('GitHub a répondu '+r.status+(r.status===401?' : token refusé.':'.'));
  return r.json();
}
const syncRun=async f=>{try{await f();}catch(e){toast(e.message);}};
const syncSend=()=>ask('Envoyer remplace les données en ligne par celles de cet appareil.',()=>{syncRun(async()=>{
  const cur=await gh('GET');
  await gh('PUT',{message:'EPS Run : synchro '+new Date().toISOString(),content:b64e(JSON.stringify(DB)),...(cur?{sha:cur.sha}:{})});
  toast('Données envoyées.');});},'Envoyer');
const syncReceive=()=>ask('Recevoir remplace toutes les données de cet appareil par celles en ligne.',()=>{syncRun(async()=>{
  const cur=await gh('GET');if(!cur)throw new Error('Aucune donnée en ligne.');
  DB={...newDB(),...JSON.parse(b64d(cur.content))};saveDB();show('home');toast('Données reçues.');});},'Recevoir');

$('bareForm').onclick=e=>{const t=e.target.closest('[data-b]');if(!t)return;const[a,i,k,j]=t.dataset.b.split(':'),c=editB.competences[i];
  if(a==='ac')editB.competences.push({id:uid(),name:'Nouvelle compétence',source:Object.keys(SOURCES[editB.activity])[0],levels:{all:[{min:0,label:'Niveau 1',color:PALETTE[0][1],note:null}]}});
  if(a==='dc')editB.competences.splice(i,1);
  if(a==='al'){const r=c.levels[k];r.push({min:(r.at(-1)?.min||0)+1,label:'Niveau '+(r.length+1),color:PALETTE[0][1],note:null});}
  if(a==='dl'&&c.levels[k].length>1)c.levels[k].splice(j,1);
  if(a==='pg'){c.levels=t.checked?{fille:clone(c.levels.all),garcon:clone(c.levels.all)}:{all:clone(c.levels.garcon||c.levels.fille)};}
  if(a==='lin'){const r=[...c.levels[k]].sort((x,y)=>x.min-y.min),f=r[0],l=r.at(-1);if(f.note==null||l.note==null||l.min===f.min)return toast('Renseignez la note du premier et du dernier niveau.');
    r.forEach(x=>x.note=Math.round((f.note+(l.note-f.note)*(x.min-f.min)/(l.min-f.min))*100)/100);}

function saveBareme(){const b=editB;if(!b.name.trim())return toast('Donnez un nom au barème.');

  const i=DB.baremes.findIndex(x=>x.id===b.id);if(i<0)DB.baremes.push(b);else DB.baremes[i]=b;
  if($('bDef').checked)DB.activeBareme[b.activity]=b.id;else if(DB.activeBareme[b.activity]===b.id)return toast('Choisissez un autre barème actif avant de décocher celui-ci.');
  const sel=[...document.querySelectorAll('.bCls:checked')].map(x=>x.value);
  DB.classes.forEach(c=>{DB.classBareme[c.id]=DB.classBareme[c.id]||{};if(sel.includes(c.id))DB.classBareme[c.id][b.activity]=b.id;else if(DB.classBareme[c.id][b.activity]===b.id)delete DB.classBareme[c.id][b.activity];});
  saveDB();toast('Barème enregistré.');show('baremes');}

// Disposition : paysage = remplissage par colonnes (2 lignes), portrait = par lignes (2 colonnes). Les flèches d'organisation suivent cette grille.
function layout(n){return innerWidth>=innerHeight?{flow:'column',rows:Math.min(n,2),cols:Math.ceil(n/2)}:{flow:'row',cols:Math.min(n,2),rows:Math.ceil(n/2)};}
const posOf=(i,L)=>L.flow==='column'?{r:i%L.rows,c:Math.floor(i/L.rows)}:{r:Math.floor(i/L.cols),c:i%L.cols};
function neighbours(i,L,n){const at={};for(let k=0;k<n;k++){const p=posOf(k,L);at[p.r+','+p.c]=k;}const p=posOf(i,L),g=(r,c)=>at[r+','+c];return{up:g(p.r-1,p.c),down:g(p.r+1,p.c),left:g(p.r,p.c-1),right:g(p.r,p.c+1)};}

  const stu=m.waves?ws?.id:null,x=m.waves?{w:CS.wave}:{};
  if(a==='pal'){palTeam=t;return modal('Couleur de '+t.name,`<div class="row">${BOX_COLORS.map(c=>`<button data-c="${c}" style="background:${c};width:44px;height:44px" aria-label="${c}"></button>`).join('')}</div>`);}
  if(a==='minus'){const k=CS.events.findLastIndex(v=>v.team===t.id&&!v.k&&(!m.waves||v.stu===stu&&v.w===CS.wave));return k<0?toast('Aucun point à retirer.'):change(()=>CS.events.splice(k,1));}

const num=(x,d=1)=>x==null||isNaN(x)?'–':x.toFixed(d).replace('.',',');
// Une ligne par élève (modes à vagues) : tours (+ précision), distance, vitesse (biathlon : pondérée par 7 s de lancer par tour et 3 s par lancer manqué), % de tir ou de vitesse cible, puis le barème actif de la classe

const tmClose=()=>{clearInterval(TM.iv);TM.iv=null;TM.total=TM.left=0;tmShow();};
const cTimer=()=>modal('Minuteur','<label>Minutes</label><input id="tmM" type="number" min="0" value="5"><label>Secondes</label><input id="tmS" type="number" min="0" max="59" value="0">',[{label:'Annuler'},{label:'Démarrer',primary:true,fn(){
  const t=(+$('tmM').value||0)*60+(+$('tmS').value||0);if(!t){toast('Durée nulle.');return false;}clearInterval(TM.iv);TM.total=TM.left=t;TM.iv=setInterval(tmTick,1000);tmShow();}}]);
function bell(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.5,1].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.35);});}catch(e){}toast('Temps écoulé !');}

// Contre-la-montre : chaque élève court une distance fixe, le chrono de la vague tourne et on touche son nom à chaque tour.
// Biathlon : un élève « juge » compte les lancers manqués du coureur ; on saisit le total avec + et − (une série de lancers après chaque tour, dernier tour compris).
// Tout est calculé depuis la liste d'événements CC.ev ({id,wave,k:'lap'|'miss',t}) : tours, pénalités, temps final et annulation ne peuvent pas diverger.
const CCM_MODES={dfCcm:{title:'CCM demi-fond',biat:false},biatCcm:{title:'CCM biathlon',biat:true}};
let CC=null,ccTimer=null;
Object.keys(CCM_MODES).forEach(m=>SCREENS[m]=()=>{CC={mode:m,cfg:{piste:200,dist:1000,perWave:8,shots:3,penSec:5}};show('ccmCfg');});
const fmt=s=>s==null?'–':Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0').replace('.',',');
const kmhOf=(m,s)=>s?(m/s*3.6).toFixed(1).replace('.',','):'–';
// Les séances enregistrées avant cette version gardaient la pénalité sous la forme {type,val}
const penSec=c=>c.penSec??(c.pen?.type==='sec'?c.pen.val:0);
SCREENS.ccmCfg=()=>{const b=CCM_MODES[CC.mode].biat,c=CC.cfg;$('ccmCfg').innerHTML=`<div class="row"><button onclick="show('home')">← Menu</button></div><h2>${CCM_MODES[CC.mode].title}</h2>
 <datalist id="dlP">${[200,250,300,333,400].map(x=>`<option value="${x}">`).join('')}</datalist><datalist id="dlD">${[600,800,1000,1500,2000,3000].map(x=>`<option value="${x}">`).join('')}</datalist>
 <label>Taille de la piste : distance d'un tour (m)</label><input id="ccP" type="number" min="1" list="dlP" value="${c.piste}"><label>Distance à parcourir (m)</label><input id="ccD" type="number" min="1" list="dlD" value="${c.dist}">
 <label>Élèves par vague</label><input id="ccW" type="number" min="1" value="${c.perWave}">
 ${b?`<label>Lancers par série (une série après chaque tour, dernier tour compris)</label><input id="ccS" type="number" min="1" value="${c.shots}"><label>Pénalité par lancer manqué (secondes, 0 = aucune)</label><input id="ccV" type="number" min="0" step="any" value="${c.penSec}">`:''}
 <label>Classe (facultatif)</label><select id="ccC"><option value="">— aucune —</option>${DB.classes.map(k=>`<option value="${k.id}">${esc(k.name)} (${k.students.length})</option>`).join('')}</select>
 <label>Autres élèves — ${NAMES_HELP}</label><textarea id="ccN" rows="4"></textarea><div class="row"><button class="pri" onclick="ccmStart()">Valider et commencer</button></div>`;};
function ccmStart(){const g=id=>$(id)?+$(id).value:0,cl=getClass($('ccC').value),c=CC.cfg;
  Object.assign(c,{piste:g('ccP'),dist:g('ccD'),perWave:g('ccW')||8,shots:g('ccS')||3,penSec:Math.max(0,g('ccV'))});
  if(!c.piste||!c.dist)return toast('Renseignez la piste et la distance.');c.tours=Math.ceil(c.dist/c.piste);
  const stu=[...(cl?cl.students.map(s=>({id:s.id,name:studentName(s)})):[]),...parseNames($('ccN').value).map(name=>({id:uid(),name}))];
  if(!stu.length)return toast('Ajoutez au moins un élève.');
  Object.assign(CC,{id:uid(),classId:cl?.id||null,title:CCM_MODES[CC.mode].title+' – '+new Date().toLocaleDateString('fr-FR'),waves:Array.from({length:Math.ceil(stu.length/c.perWave)},(_,i)=>stu.slice(i*c.perWave,(i+1)*c.perWave)),wave:0,ev:[],t0:null});show('ccmRace');}
function derive(id){const ev=CC.ev.filter(e=>e.id===id),laps=ev.filter(e=>e.k==='lap'),miss=ev.filter(e=>e.k==='miss').reduce((a,e)=>a+(e.n||1),0),need=CC.cfg.tours,pen=penSec(CC.cfg)*miss,fin=laps.length>=need?laps[need-1].t:null;
  return{laps:laps.length,need,miss,pen,raw:fin,final:fin==null?null:fin+pen,times:laps.slice(0,need).map(e=>e.t)};}
const elapsed=()=>CC.t0?(Date.now()-CC.t0)/1000:0;
function ccmLap(id,t=elapsed()){if(derive(id).final!=null)return;CC.ev.push({id,wave:CC.wave,k:'lap',t});ccmDraw();}
function ccmMiss(id,d){if(d>0)CC.ev.push({id,wave:CC.wave,k:'miss',n:1,t:elapsed()});else{const k=CC.ev.findLastIndex(e=>e.id===id&&e.k==='miss');if(k<0)return;CC.ev.splice(k,1);}ccmDraw();}
SCREENS.ccmRace=()=>{ccmDraw();};
function ccmDraw(){const W=CC.waves[CC.wave],biat=CCM_MODES[CC.mode].biat;$('ccmRace').innerHTML=`<div class="row"><button onclick="ccmStop();show('home')">← Menu</button><b>Vague ${CC.wave+1} / ${CC.waves.length}</b><span id="ccClock" style="font-size:1.6rem;font-weight:700">${fmt(CC.t0?elapsed():0)}</span></div>
 <div class="grid">${W.map(s=>{const d=derive(s.id);return`<div class="item ccs${d.final!=null?' done':''}" data-id="${s.id}"><span><b>${esc(s.name)}</b><br><small>${d.laps} / ${d.need} tours</small></span>${biat?`<span class="ex">✗ ${d.miss} <button data-m="-1" aria-label="Un lancer manqué de moins">−</button><button data-m="1" aria-label="Un lancer manqué de plus">+</button></span>`:''}<b>${d.final!=null?fmt(d.final):''}</b></div>`;}).join('')}</div>
 <div class="row"><button class="pri" onclick="ccmGo()">Départ de la vague</button><button onclick="ccmUndo()">Annuler</button><button onclick="ccmMove(-1)">Vague préc.</button><button onclick="ccmMove(1)">Vague suiv.</button><button onclick="ccmEnd()">Résultats</button><button onclick="show('ccmCfg')">Config</button></div>`;}
$('ccmRace').onclick=e=>{const c=e.target.closest('.ccs'),m=e.target.closest('[data-m]');if(!c)return;if(m)return ccmMiss(c.dataset.id,+m.dataset.m);
  if(!CC.t0)return toast('Lancez d\'abord le départ de la vague.');ccmLap(c.dataset.id);};
function ccmStop(){clearInterval(ccTimer);ccTimer=null;}
function ccmGo(){ccmStop();CC.t0=Date.now();ccTimer=setInterval(()=>{const c=$('ccClock');if(c)c.textContent=fmt(elapsed());},100);}
function ccmMove(d){const n=CC.wave+d;if(n<0||n>=CC.waves.length)return;ccmStop();CC.t0=null;CC.wave=n;ccmDraw();}
function ccmUndo(){const k=CC.ev.findLastIndex(e=>e.wave===CC.wave);if(k<0)return toast('Rien à annuler.');CC.ev.splice(k,1);ccmDraw();}
function ccmRows(){const cl=getClass(CC.classId),bar=getBareme('ccm',CC.classId);
  return CC.waves.flatMap((w,i)=>w.map(s=>({s,wave:i+1,...derive(s.id)}))).map(r=>({...r,g:bar?gradeBareme(bar,{time:r.final},cl?.students.find(x=>x.id===r.s.id)?.gender||'')[0]?.level:null,bar})).sort((a,b)=>(a.final==null)-(b.final==null)||a.final-b.final);}
// Tendance de l'allure : pente des temps de tour (accélère / ralentit) puis régularité (constant / yoyo)
function ccmTrend(sp){const n=sp.length;if(n<3)return'';const m=sp.reduce((a,b)=>a+b,0)/n,xm=(n-1)/2,slope=sp.reduce((a,v,i)=>a+(i-xm)*(v-m),0)/sp.reduce((a,_,i)=>a+(i-xm)**2,0),rel=slope*(n-1)/m,
  cv=Math.sqrt(sp.reduce((a,v)=>a+(v-m)**2,0)/n)/m,flips=sp.slice(2).filter((v,i)=>(v-sp[i+1])*(sp[i+1]-sp[i])<0).length;
  if(rel<-.05)return'🚀 Il accélère : ses tours deviennent plus rapides.';if(rel>.05)return'🐢 Il ralentit : ses tours deviennent plus lents.';
  return cv>.06&&flips>=Math.floor((n-2)/2)?'🎢 Allure en yoyo : tours rapides et lents en alternance.':'⚖️ Allure régulière.';}
function ccmDetailHTML(r){const c=CC.cfg,t=r.times;if(!t.length)return'<p class="empty">Aucun tour enregistré.</p>';
  const sp=t.map((x,i)=>x-(t[i-1]??0)),kmh=sp.map(s=>c.piste/s*3.6),mx=Math.max(...kmh),m=sp.reduce((a,b)=>a+b,0)/sp.length;
  return`<p>Temps moyen par tour : <b>${fmt(m)}</b> · allure moyenne : <b>${kmhOf(c.piste,m)} km/h</b></p><p>${ccmTrend(sp)}</p><div class="scroll"><table class="lv"><tr><th>Tour</th><th>Passage</th><th>Temps du tour</th><th>Allure</th><th></th></tr>
  ${sp.map((s,i)=>`<tr><td>${i+1}</td><td>${fmt(t[i])}</td><td>${fmt(s)}</td><td>${kmhOf(c.piste,s)} km/h</td><td style="width:35%"><div class="sp" style="width:${100*kmh[i]/mx}%"></div></td></tr>`).join('')}</table></div>${CCM_MODES[CC.mode].biat?'<p class="empty">Les temps de passage incluent le passage aux lancers.</p>':''}`;}
// Une ligne par élève ; un clic sur la ligne ouvre le détail des tours (page autonome : fonctionne aussi depuis l'historique)
function ccmResultsHTML(){const rows=ccmRows(),bar=rows[0]?.bar,c=CC.cfg,biat=CCM_MODES[CC.mode].biat,run=c.piste*c.tours;let rk=0;
  return rows.map(r=>{const done=r.final!=null,tot=c.shots*r.need;
    return`<details class="rk"><summary><b>${done?++rk:'–'}</b><span class="nm">${esc(r.s.name)}</span><small>vague ${r.wave}</small><b>${done?fmt(r.final):'Non terminé ('+r.laps+'/'+r.need+')'}</b>${done?`<span>🏃 ${kmhOf(run,r.raw)} km/h</span>`:''}`
    +(biat&&done?`<span>🎯 ${r.miss} manqué(s) / ${tot} · ${num(100*(1-r.miss/tot),0)} %</span><span>⏱️ +${r.pen} s → ${kmhOf(run,r.final)} km/h</span>`:'')+(bar&&done?chip(r.g,bar):'')+`</summary><div class="dt">${ccmDetailHTML(r)}</div></details>`;}).join('');}
const ccmEnd=()=>{saveCcm();modal('Résultats – '+CCM_MODES[CC.mode].title,ccmResultsHTML());};
const restoreCcm=r=>({id:r.id,mode:r.mode,title:r.title,classId:r.classId,cfg:r.data.cfg,waves:r.data.waves,ev:r.data.ev,wave:0,t0:null});
function saveCcm(){const r={id:CC.id,mode:CC.mode,title:CC.title,date:new Date().toISOString(),classId:CC.classId,lapM:CC.cfg.piste,note:'',data:{cfg:CC.cfg,waves:CC.waves,ev:CC.ev}};
  const i=DB.sessions.findIndex(s=>s.id===r.id);if(i<0)DB.sessions.push(r);else DB.sessions[i]=r;saveDB();}

// Fractionné : groupes de vitesse + blocs d'effort/récupération. La bande-son est pilotée par une horloge unique (PL) qui déclenche les « tops » (sifflets, annonces) :
// avancer, reculer ou mettre en pause ne demande donc aucun calcul particulier.
const PREP=10,SPEEDS=Array.from({length:33},(_,i)=>6+i*.5);
let FS=null,fsel=new Set();
const newFract=()=>({id:uid(),title:'Fractionné – '+new Date().toLocaleDateString('fr-FR'),classId:null,pct:[90,95,100,110],unassigned:[],blocks:[{reps:8,effort:30,rec:30,rest:5}],
  groups:[[8,BOX_COLORS[3]],[10,BOX_COLORS[5]],[12,BOX_COLORS[0]]].map(([speed,color],i)=>({id:uid(),name:'Groupe '+(i+1),speed,color,members:[]}))});
const fsave=()=>{DB.fractDraft=FS;saveDB();};
const fdist=(speed,sec,pct)=>Math.round(speed/3.6*sec*pct/100);
function fractSegs(){const s=[{type:'prep',dur:PREP}];FS.blocks.forEach((b,bi)=>{for(let r=1;r<=b.reps;r++){s.push({type:'effort',dur:b.effort,b:bi+1,r});if(r<b.reps&&b.rec>0)s.push({type:'rec',dur:b.rec,b:bi+1});}
  if(bi<FS.blocks.length-1&&b.rest>0)s.push({type:'rest',dur:b.rest*60,b:bi+1});});return s;}
const fmtT=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function fractCues(){const cues=[];let t=0;const segs=fractSegs();segs.forEach((g,i)=>{const nx=segs[i+1];
  if(g.type==='effort'){cues.push({t,w:'start',say:`Course ${g.r}, bloc ${g.b}`});}
  else if(g.type!=='effort'&&nx&&nx.type==='effort'&&g.dur>=6)cues.push({t:t+g.dur-5,say:'5 secondes avant le départ'});
  const end=t+g.dur;if(g.type==='effort'&&nx)cues.push({t:end,w:'end',say:nx.type==='rest'?`Fin du bloc ${g.b}. Repos`:'Récupération'});t=end;});
  cues.push({t,w:'final',say:'Fin de séance'});return cues.sort((a,b)=>a.t-b.t);}
// Son : sifflets générés à la volée, annonces par synthèse vocale (si le navigateur en propose une)
let AC=null;
function whistle(kind){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n={start:[0,.25],end:[0],final:[0,.4,.8]}[kind];
  n.forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=2700;g.gain.value=.25;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+d;o.start(t);o.stop(t+(kind==='end'?.7:.18));});}catch(e){}}
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';speechSynthesis.speak(u);}catch(e){}}
let PL={pos:0,last:-1,iv:null,t0:0,base:0},PLS=null;
const plTotal=()=>PLS.total();
const fractTotal=()=>fractSegs().reduce((a,s)=>a+s.dur,0);
function plStep(pos){const tot=plTotal();pos=Math.min(pos,tot);PLS.cues().filter(c=>c.t>PL.last&&c.t<=pos).forEach(c=>{if(c.w)whistle(c.w);if(c.say)speak(c.say);});PL.last=pos;PL.pos=pos;
  const el=$('plHead');if(el){el.style.left=100*pos/tot+'%';$('plTime').textContent=fmtT(pos)+' / '+fmtT(tot);$('plLabel').textContent=PLS.label(pos);}if(pos>=tot)plPause();}
function fractLabel(pos){let t=0;for(const g of fractSegs()){if(pos<t+g.dur){const left=Math.ceil(t+g.dur-pos);return({prep:'Préparation',effort:`Course ${g.r} · bloc ${g.b}`,rec:'Récupération',rest:'Repos entre les blocs'})[g.type]+' – '+left+' s';}t+=g.dur;}return'Séance terminée';}
function plPlay(){if(PL.iv)return plPause();if(PL.pos>=plTotal())PL.pos=0,PL.last=-1;PL.base=PL.pos;PL.t0=performance.now();PL.iv=setInterval(()=>plStep(PL.base+(performance.now()-PL.t0)/1000),100);$('plPlay').textContent='⏸';}
function plPause(){clearInterval(PL.iv);PL.iv=null;const b=$('plPlay');if(b)b.textContent='▶';}
function plSeek(pos){const was=!!PL.iv;plPause();PL.pos=Math.max(0,Math.min(pos,plTotal()));PL.last=PL.pos<=0?-1:PL.pos;plStep2();if(was)plPlay();}
const plStep2=()=>{const p=PL.pos,l=PL.last;plStep(p);PL.last=l;};
const plStop=()=>{plPause();PL.pos=0;PL.last=-1;plStep2();};
// Écran
SCREENS.fract=()=>{PLS={total:fractTotal,cues:fractCues,label:fractLabel};FS=DB.fractDraft||newFract();fsel.clear();plStop2();draw();};
const plStop2=()=>{clearInterval(PL.iv);PL.iv=null;PL.pos=0;PL.last=-1;};
function draw(){const segs=fractSegs(),tot=fractTotal(),eff=[...new Set(FS.blocks.map(b=>b.effort))].sort((a,b)=>a-b);
  const tag=s=>`<span class="tag${fsel.has(s.id)?' on':''}" data-s="${s.id}">${esc(s.name)}</span>`;
  $('fract').innerHTML=`<div class="row"><button onclick="show('home')">← Menu</button><button onclick="fClass()">Classe</button><button onclick="fList()">Liste</button><button onclick="fAuto()">Répartir selon la vitesse cible</button><button onclick="fPct()">Pourcentages</button></div>
  <h2>Séance fractionné</h2><div class="unas" style="margin-bottom:8px">Élèves non assignés — sélectionnez-les, puis « Placer ici » dans un groupe : ${FS.unassigned.map(tag).join('')||'aucun'}</div>
  ${FS.groups.map((g,i)=>`<div class="box gc" style="border-left:8px solid ${g.color};margin:8px 0;width:auto"><div class="row"><input data-f="gn" data-g="${i}" value="${esc(g.name)}" style="width:9em"><select data-f="gs" data-g="${i}" style="width:auto">${SPEEDS.map(v=>`<option${v===g.speed?' selected':''}>${v}</option>`).join('')}</select> km/h
   <select data-f="gc" data-g="${i}" style="width:auto">${BOX_COLORS.map(c=>`<option value="${c}" style="color:${c}"${c===g.color?' selected':''}>■</option>`).join('')}</select><button data-a="gput" data-g="${i}">Placer ici</button><button class="dan" data-a="gdel" data-g="${i}" aria-label="Supprimer le groupe">×</button></div>
   <div>${eff.map(e=>`<div>${e} s : <b>${fdist(g.speed,e,100)} m</b> <small class="empty">(${FS.pct.filter(p=>p!==100).map(p=>p+' % : '+fdist(g.speed,e,p)+' m').join(' · ')})</small></div>`).join('')}</div><div class="mem" style="margin:4px 0 0">${g.members.map(tag).join('')}</div></div>`).join('')}
  <div class="row"><button data-a="gadd">+ Groupe</button></div><h3>Blocs</h3>
  ${FS.blocks.map((b,i)=>`<div class="row" style="align-items:end"><b>Bloc ${i+1}</b>${[['br','Répétitions','reps',1],['be','Effort (s)','effort',1],['bc','Récup (s)','rec',0]].concat(i<FS.blocks.length-1?[['bs','Repos après (min)','rest',0]]:[]).map(([f,l,k,m])=>`<label style="margin:0">${l}<input type="number" min="${m}" step="any" data-f="${f}" data-b="${i}" value="${b[k]}" style="width:6em"></label>`).join('')}<button class="dan" data-a="bdel" data-b="${i}" aria-label="Supprimer le bloc">×</button></div>`).join('')}
  <div class="row"><button data-a="badd">+ Bloc</button></div><p>Durée de la séance : <b>${fmtT(tot-PREP)}</b> (préparation de ${PREP} s non comprise)</p>
  ${playerHTML(segs.map(s=>`<div style="width:${100*s.dur/tot}%;background:${s.type==='effort'?'#dc2626':s.type==='rec'?'#94a3b8':s.type==='rest'?'#cbd5e1':'#eab308'}"></div>`).join(''))}
  <div class="row"><button class="pri" onclick="fSave()">Enregistrer la séance</button></div>`;plStep2();}
const fFind=id=>FS.groups.flatMap(g=>g.members).concat(FS.unassigned).find(s=>s.id===id);
$('fract').onchange=e=>{const d=e.target.dataset,f=d.f;if(!f)return;const g=FS.groups[d.g],b=FS.blocks[d.b],v=e.target.value;
  if(f==='gn')g.name=v.trim()||g.name;if(f==='gs')g.speed=+v;if(f==='gc')g.color=v;
  if(f==='br')b.reps=Math.max(1,Math.round(+v)||1);if(f==='be')b.effort=Math.max(1,+v||1);if(f==='bc')b.rec=Math.max(0,+v||0);if(f==='bs')b.rest=Math.max(0,+v||0);fsave();draw();};
$('fract').onclick=e=>{const tag=e.target.closest('[data-s]'),a=e.target.closest('[data-a]')?.dataset;
  if(tag){fsel.has(tag.dataset.s)?fsel.delete(tag.dataset.s):fsel.add(tag.dataset.s);return draw();}if(!a||a.a[0]==='p')return;const g=FS.groups[a.g];
  if(a.a==='gput'){if(!fsel.size)return toast('Sélectionnez d\'abord des élèves.');const mv=[...FS.unassigned,...FS.groups.flatMap(x=>x.members)].filter(s=>fsel.has(s.id));FS.unassigned=FS.unassigned.filter(s=>!fsel.has(s.id));FS.groups.forEach(x=>x.members=x.members.filter(s=>!fsel.has(s.id)));g.members.push(...mv);fsel.clear();}
  if(a.a==='gdel'){FS.unassigned.push(...g.members);FS.groups.splice(a.g,1);}
  if(a.a==='gadd')FS.groups.push({id:uid(),name:'Groupe '+(FS.groups.length+1),speed:10,color:BOX_COLORS[FS.groups.length%BOX_COLORS.length],members:[]});
  if(a.a==='badd')FS.blocks.push({...FS.blocks.at(-1)||{reps:8,effort:30,rec:30,rest:5}});if(a.a==='bdel'&&FS.blocks.length>1)FS.blocks.splice(a.b,1);
  fsave();draw();};
// Lecteur (commun au Fractionné et au Stadium) : boutons et clic sur la frise pour se déplacer
const playerHTML=bar=>`<div class="row"><button data-a="pstop" aria-label="Arrêt">⏹</button><button id="plPlay" data-a="pplay" aria-label="Lecture ou pause">▶</button><button data-a="pback">−10 s</button><button data-a="pfwd">+10 s</button><span id="plTime"></span><span id="plLabel"></span></div>
  <div id="plBar" style="position:relative;display:flex;height:34px;border:1px solid var(--bd);border-radius:6px;overflow:hidden;cursor:pointer">${bar}<div id="plHead" style="position:absolute;top:0;bottom:0;width:3px;background:var(--tx);left:0"></div></div>`;
function plClick(e){const bar=e.target.closest('#plBar'),a=e.target.closest('[data-a]')?.dataset.a;
  if(bar){const r=bar.getBoundingClientRect();return plSeek(plTotal()*(e.clientX-r.left)/r.width);}
  ({pplay:plPlay,pstop:plStop,pback:()=>plSeek(PL.pos-10),pfwd:()=>plSeek(PL.pos+10)})[a]?.();}
$('fract').addEventListener('click',plClick);
const fAdd=l=>{FS.unassigned.push(...l.filter(s=>!fFind(s.id)));fsave();draw();};
const fClass=()=>DB.classes.length?modal('Importer une classe','<label>Classe</label><select id="fC">'+DB.classes.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.students.length})</option>`).join('')+'</select>',[{label:'Annuler'},{label:'Importer',primary:true,fn(){const c=getClass($('fC').value);FS.classId=c.id;fAdd(c.students.map(s=>({id:s.id,name:studentName(s)})));}}]):toast('Créez d\'abord une classe dans Gestion de classe.');
const fList=()=>modal('Ajouter des élèves',`<label>${NAMES_HELP}</label><textarea id="fN" rows="6"></textarea>`,[{label:'Annuler'},{label:'Ajouter',primary:true,fn(){const l=parseNames($('fN').value).map(name=>({id:uid(),name}));if(!l.length){toast('Liste vide.');return false;}fAdd(l);}}]);
function fAuto(){const cl=getClass(FS.classId);if(!cl)return toast('Importez d\'abord une classe avec des vitesses cibles.');let n=0;
  FS.unassigned=FS.unassigned.filter(s=>{const v=cl.students.find(x=>x.id===s.id)?.targetSpeed;if(!v||!FS.groups.length)return true;FS.groups.reduce((b,g)=>Math.abs(g.speed-v)<Math.abs(b.speed-v)?g:b).members.push(s);n++;return false;});
  fsave();draw();toast(n+' élève(s) placé(s) selon leur vitesse cible.');}
const fPct=()=>modal('Pourcentages de la vitesse','<label>Pourcentages affichés pour les distances, séparés par des virgules</label><input id="fP" value="'+FS.pct.join(', ')+'">',[{label:'Annuler'},{label:'Enregistrer',primary:true,fn(){const p=$('fP').value.split(/[,;\s]+/).map(Number).filter(x=>x>0);if(!p.length){toast('Indiquez au moins un pourcentage.');return false;}FS.pct=p;fsave();draw();}}]);
const fractSummary=()=>{const eff=[...new Set(FS.blocks.map(b=>b.effort))];return`<p>Durée : <b>${fmtT(fractTotal()-PREP)}</b></p>`+FS.groups.map(g=>`<p><b>${esc(g.name)}</b> — ${g.speed} km/h — ${g.members.map(m=>esc(m.name)).join(', ')||'aucun élève'}<br><small>${eff.map(e=>e+' s : '+fdist(g.speed,e,100)+' m').join(' · ')}</small></p>`).join('');};
const restoreFract=r=>({id:r.id,title:r.title,classId:r.classId,pct:r.data.pct,unassigned:r.data.unassigned,blocks:r.data.blocks,groups:r.data.groups});
function fSave(){modal('Enregistrer la séance',`<label>Nom de la séance</label><input id="fT" value="${esc(FS.title)}">`+fractSummary(),[{label:'Annuler'},{label:'Enregistrer',primary:true,fn(){
  FS.title=$('fT').value.trim()||FS.title;const r={id:FS.id,mode:'fract',title:FS.title,date:new Date().toISOString(),classId:FS.classId,note:'',data:{groups:FS.groups,blocks:FS.blocks,pct:FS.pct,unassigned:FS.unassigned}};
  const i=DB.sessions.findIndex(s=>s.id===r.id);i<0?DB.sessions.push(r):DB.sessions[i]=r;fsave();toast('Séance enregistrée.');}}]);}

// Stadium : piste en 4 quarts égaux de P/4 (ligne droite, virage, ligne droite, virage), mesurée au bord intérieur du couloir 1.
// La même fonction stPoint() sert à placer les plots ET le dessin de la piste est tracé avec la même géométrie : les plots sont donc toujours sur la piste.
// Le plot n°1 est à la jonction « fin de ligne droite / début de virage » (ligne de départ-arrivée). Sens de course : anti-horaire, comme en athlétisme.
const ST_SPEEDS=[7,8,9,10,11,12,13,14,15],ST_LAPS=7;
let ST={mode:'5m',P:100,N:20},stTab=0,stSpeed=null;
function stCheck(P,N){if(!(P>0&&P<=400))return'Le périmètre doit être compris entre 1 et 400 m.';if(!Number.isInteger(N)||N<10||N>40||N%2)return'Le nombre de plots doit être pair, entre 10 et 40.';
  if(N%4===0||Math.abs(P/N/5-Math.round(P/N/5))<1e-9)return'';return`${N} plots sur ${P} m donnent un écart de ${(P/N).toFixed(2).replace('.',',')} m : choisissez un nombre de plots multiple de 4, ou un écart entre plots multiple de 5 m (5, 10, 15…).`;}
const stValidN=P=>Array.from({length:16},(_,i)=>10+2*i).filter(N=>!stCheck(P,N));
const stGeom=P=>({P,a:P/4,r:P/(4*Math.PI)});
function stPoint(g,s){const{P,a,r}=g,q=Math.PI*r;s=((s%P)+P)%P;
  if(s<a)return{x:r+s,y:2*r,nx:0,ny:1};if(s<a+q){const t=-Math.PI/2+(s-a)/r;return{x:r+a+r*Math.cos(t),y:r-r*Math.sin(t),nx:Math.cos(t),ny:-Math.sin(t)};}
  if(s<2*a+q)return{x:r+a-(s-a-q),y:0,nx:0,ny:-1};const t=Math.PI/2+(s-2*a-q)/r;return{x:r+r*Math.cos(t),y:r-r*Math.sin(t),nx:Math.cos(t),ny:-Math.sin(t)};}
const stPlots=g=>Array.from({length:ST.N},(_,i)=>({i:i+1,s:g.a+i*g.P/ST.N,...stPoint(g,g.a+i*g.P/ST.N)}));
const stQuarters=g=>{const c=[0,0,0,0];stPlots(g).forEach(p=>c[Math.floor(((p.s-g.a)/(g.P/4))+1e-9)%4]++);return c;};
const f2=x=>x.toFixed(2).replace('.',',');
function stSVG(g){const{a,r}=g,W=a+2*r,H=2*r,fs=Math.max(W,H)/30,pad=fs*4,pl=stPlots(g);
  return`<svg viewBox="${-pad} ${-pad} ${W+2*pad} ${H+2*pad}" width="100%" role="img" aria-label="Schéma de la piste"><path d="M${r} 0L${r+a} 0A${r} ${r} 0 0 1 ${r+a} ${2*r}L${r} ${2*r}A${r} ${r} 0 0 1 ${r} 0Z" fill="none" stroke="currentColor" stroke-width="${fs/5}"/>
  <line x1="0" y1="${r}" x2="${W}" y2="${r}" stroke="#16a34a" stroke-width="${fs/8}" stroke-dasharray="${fs/2} ${fs/3}"/><text x="${W/2}" y="${r-fs/3}" font-size="${fs}" fill="#16a34a" text-anchor="middle">${f2(W)} m</text>
  <line x1="${r+a/2}" y1="0" x2="${r+a/2}" y2="${H}" stroke="#2563eb" stroke-width="${fs/8}" stroke-dasharray="${fs/2} ${fs/3}"/><text x="${r+a/2+fs/3}" y="${r+fs*1.2}" font-size="${fs}" fill="#2563eb">${f2(H)} m</text>
  ${[0,a,a+Math.PI*r,2*a+Math.PI*r].map(s=>{const p=stPoint(g,s);return`<rect x="${p.x-fs/3}" y="${p.y-fs/3}" width="${fs*2/3}" height="${fs*2/3}" fill="none" stroke="#94a3b8" stroke-width="${fs/10}" transform="rotate(45 ${p.x} ${p.y})"/>`;}).join('')}
  ${pl.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${fs*.42}" fill="${p.i===1?'#16a34a':'#dc2626'}"/><text x="${p.x+p.nx*fs*1.5}" y="${p.y+p.ny*fs*1.5+fs/3}" font-size="${fs*.9}" text-anchor="middle" fill="currentColor">${p.i}</text>`).join('')}
  <text x="${r+a/2}" y="${-fs*2.3}" font-size="${fs*.8}" text-anchor="middle" fill="currentColor">Sens de course ↺ anti-horaire · plot 1 (vert) = départ / arrivée</text></svg>`;}
const stLegend=g=>{const sp=g.P/ST.N,q=stQuarters(g);return`<p>Périmètre <b>${f2(g.P)} m</b> · <b>${ST.N}</b> plots · écart entre plots <b>${f2(sp)} m</b></p>
  <p>Chaque quart mesure <b>${f2(g.a)} m</b> : ligne droite <b>${f2(g.a)} m</b> · virage de <b>${f2(g.a)} m</b> (rayon <b>${f2(g.r)} m</b>)</p>
  <p><span style="color:#2563eb">●</span> Distance entre les deux lignes droites : <b>${f2(2*g.r)} m</b><br><span style="color:#16a34a">●</span> Distance entre les extrémités des deux virages : <b>${f2(g.a+2*g.r)} m</b></p>
  <p class="empty">Plots par quart (à partir du plot 1, ligne de départ-arrivée, dans le sens de course) : virage ${q[0]} · droite ${q[1]} · virage ${q[2]} · droite ${q[3]}. Les losanges gris marquent les 4 jonctions droite/virage.</p>`;};
const stLap=g=>g.P/(stSpeed/3.6),stT=s=>s<60?s.toFixed(1).replace('.',',')+' s':fmt(s);
SCREENS.stadium=()=>{PLS=PLS_ST;plStop2();stDraw();};
function stDraw(){const g=stGeom(ST.P),is5=ST.mode==='5m',ns=is5?[10,12,16,20,24,28,32,36,40]:stValidN(ST.P);
  const stadium=`<div class="row"><label><input type="radio" name="stm" value="5m" style="width:auto"${is5?' checked':''}> Espacement de 5 m</label><label><input type="radio" name="stm" value="free" style="width:auto"${is5?'':' checked'}> Espacement libre</label></div>
   <div class="row">${is5?'':`<label style="margin:0">Périmètre (m)<input data-i="P" type="number" min="1" max="400" step="any" value="${ST.P}" style="width:7em"></label>`}<label style="margin:0">Nombre de plots<input data-i="N" type="number" min="10" max="40" step="2" value="${ST.N}" style="width:6em"></label></div>
   <div class="row">${ns.map(n=>`<button data-a="n" data-n="${n}"${n===ST.N?' class="pri"':''}>${n}</button>`).join('')}</div>${stSVG(g)}${stLegend(g)}`;
  const lapsTab=`<div class="scroll"><table class="lv"><tr><th>km/h</th><th>1 tour</th>${Array.from({length:8},(_,i)=>`<th>${f2((i+1)/2)}</th>`).join('')}</tr>${ST_SPEEDS.map(v=>{const l=g.P/(v/3.6);return`<tr data-v="${v}" style="cursor:pointer${v===stSpeed?';background:var(--bd)':''}"><td><b>${v}</b></td><td>${stT(l)}</td>${Array.from({length:8},(_,i)=>`<td>${stT(l*(i+1)/2)}</td>`).join('')}</tr>`;}).join('')}</table></div>`;
  let sel='';if(stSpeed){const l=stLap(g);sel=`<h3>${stSpeed} km/h : un tour en ${stT(l)}</h3><div class="scroll"><table class="lv"><tr>${Array.from({length:2*ST_LAPS},(_,i)=>`<th>${f2((i+1)/2)} t</th>`).join('')}</tr><tr>${Array.from({length:2*ST_LAPS},(_,i)=>`<td>${stT(l*(i+1)/2)}</td>`).join('')}</tr></table></div>
   ${playerHTML(Array.from({length:ST_LAPS},(_,i)=>`<div style="flex:1;background:${i%2?'#fca5a5':'#f87171'};text-align:center;color:#fff;font-size:.8rem">${i+1}</div>`).join(''))}<div class="row"><button data-a="clr">Effacer la sélection</button></div>`;}
  $('stadium').innerHTML=`<div class="row"><button onclick="show('home')">← Menu</button></div><h2>Calculateur Stadium</h2><div class="row"><button data-a="t0"${stTab?'':' class="pri"'}>Stadium</button><button data-a="t1"${stTab?' class="pri"':''}>Temps / allure</button></div>
   ${stTab?`<p class="empty">Piste de ${f2(g.P)} m. Touchez une vitesse pour obtenir le temps par tour et la bande-son avec un sifflet à chaque tour.</p>${lapsTab}${sel}`:stadium}`;plStep2();}
const stSet=(P,N)=>{const e=stCheck(P,N);if(e){toast(e);return false;}ST.P=P;ST.N=N;return true;};
// Changer le périmètre ne peut pas être refusé à cause du nombre de plots : on ajuste celui-ci au plus proche nombre valable
function stSetP(P){if(!(P>0&&P<=400))return toast('Le périmètre doit être compris entre 1 et 400 m.');ST.P=P;
  if(stCheck(P,ST.N)){ST.N=stValidN(P).reduce((b,n)=>Math.abs(n-ST.N)<Math.abs(b-ST.N)?n:b);toast(`Nombre de plots ajusté à ${ST.N} pour ce périmètre.`);}}
$('stadium').onchange=e=>{const d=e.target.dataset.i,is5=ST.mode==='5m';if(e.target.name==='stm'){ST.mode=e.target.value;if(ST.mode==='5m')ST.P=5*ST.N;return stDraw();}if(!d)return;const v=parseFloat(e.target.value);
  if(d==='N')stSet(is5?5*v:ST.P,v);else stSetP(v);stDraw();};
$('stadium').onclick=e=>{const a=e.target.closest('[data-a]')?.dataset,row=e.target.closest('tr[data-v]');plClick(e);
  if(row){stSpeed=+row.dataset.v;PLS=PLS_ST;plStop2();return stDraw();}if(!a)return;
  if(a.a==='n'){stSet(ST.mode==='5m'?5*+a.n:ST.P,+a.n);stDraw();}if(a.a==='t0'||a.a==='t1'){plStop2();stTab=+a.a[1];stDraw();}if(a.a==='clr'){plStop2();stSpeed=null;stDraw();}};
// Bande-son : un sifflet au départ puis un à la fin de chaque tour (qui lance le suivant)
const PLS_ST={total:()=>ST_LAPS*stLap(stGeom(ST.P)),cues:()=>Array.from({length:ST_LAPS+1},(_,k)=>({t:k*stLap(stGeom(ST.P)),w:'end'})),
  label:pos=>{const l=stLap(stGeom(ST.P)),k=Math.min(ST_LAPS,Math.floor(pos/l)+1);return pos>=ST_LAPS*l?'Terminé':`Tour ${k} / ${ST_LAPS} – ${Math.ceil((k*l-pos))} s`;}};

// Historique : une séance enregistrée = {id,mode,title,date,classId,lapM,minutes,note,data}. « Voir » recalcule les résultats depuis les données ; « Reprendre » rouvre le mode d'origine dans l'état enregistré (même id : la séance est mise à jour, pas dupliquée).
let HF={mode:null,cls:'',keep:false};
const modeLabel=m=>COUNTER_MODES[m]?.title||CCM_MODES[m]?.title||'Séance fractionné';
const cHist=()=>{HF={mode:CS.mode,cls:'',keep:true};show('history');};
SCREENS.history=()=>{if(!HF.keep)HF.mode=null;HF.keep=false;const modes=[...new Set(DB.sessions.map(s=>s.mode))],list=DB.sessions.filter(s=>(!HF.mode||s.mode===HF.mode)&&(!HF.cls||s.classId===HF.cls)).sort((a,b)=>b.date.localeCompare(a.date));
  $('history').innerHTML=`<div class="row"><button onclick="show('home')">← Menu</button></div><h2>Historique des séances</h2>
  <div class="row"><button data-m=""${HF.mode?'':' class="pri"'}>Tous les modes</button>${modes.map(m=>`<button data-m="${m}"${HF.mode===m?' class="pri"':''}>${esc(modeLabel(m))}</button>`).join('')}</div>
  ${DB.classes.length?`<div class="row"><select id="hCls" style="width:auto"><option value="">Toutes les classes</option>${DB.classes.map(c=>`<option value="${c.id}"${HF.cls===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}
  ${list.length?list.map(s=>`<div class="stu"><span class="n"><b>${esc(s.title)}</b><br><small>${esc(modeLabel(s.mode))} · ${new Date(s.date).toLocaleDateString('fr-FR')}${s.classId&&getClass(s.classId)?' · '+esc(getClass(s.classId).name):''}</small></span><button data-a="view" data-id="${s.id}">Voir</button><button data-a="resume" data-id="${s.id}">Reprendre</button><button class="dan" data-a="del" data-id="${s.id}">Supprimer</button></div>`).join(''):'<p class="empty">Aucune séance enregistrée. Une séance est enregistrée quand vous terminez un mode (bouton Fin ou Résultats).</p>'}`;};
$('history').onclick=e=>{const m=e.target.closest('[data-m]');if(m){HF.mode=m.dataset.m||null;HF.keep=true;return SCREENS.history();}
  const b=e.target.closest('[data-a]');if(!b)return;const r=DB.sessions.find(s=>s.id===b.dataset.id);if(!r)return;
  if(b.dataset.a==='del')return ask(`Supprimer la séance « ${r.title} » ? Cette action est irréversible.`,()=>{DB.sessions=DB.sessions.filter(s=>s.id!==r.id);saveDB();HF.keep=true;SCREENS.history();},'Supprimer');
  if(b.dataset.a==='view')return viewSession(r);resumeSession(r);};
$('history').onchange=e=>{if(e.target.id==='hCls'){HF.cls=e.target.value;HF.keep=true;SCREENS.history();}};
function viewSession(r){let html;
  if(COUNTER_MODES[r.mode]){const p=CS;CS=restoreCounter(r);html=`<p class="empty">Piste : ${r.lapM} m${r.minutes&&COUNTER_MODES[r.mode].waves?' · durée : '+r.minutes+' min':''}</p>`+resultsHTML()+(r.note?`<p><b>Remarque :</b> ${esc(r.note)}</p>`:'');CS=p;}
  else if(CCM_MODES[r.mode]){const p=CC;CC=restoreCcm(r);html=ccmResultsHTML();CC=p;}
  else{const p=FS;FS=restoreFract(r);html=fractSummary();FS=p;}
  modal(r.title,html,[{label:'Fermer'}]);}
function resumeSession(r){
  if(COUNTER_MODES[r.mode]){CS=restoreCounter(r);hist=[];redo=[];sel.clear();organise=false;return show('counterMain');}
  if(CCM_MODES[r.mode]){CC=restoreCcm(r);return show('ccmRace');}
  DB.fractDraft=restoreFract(r);saveDB();show('fract');}

applyTheme();show('home');
</script></body></html>
